<ion-header class="ion-no-border reset-header">
  <ion-toolbar class="reset-toolbar">
    <ion-buttons slot="end">
      <ion-back-button
        defaultHref="/forgot-password"
        text=""
        icon="arrow-forward-outline">
      </ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content
  [fullscreen]="true"
  class="reset-password-page"
  dir="rtl">

  <ion-grid class="reset-layout">

    <!-- الجزء العلوي -->
    <ion-row class="heading-row">
  <ion-col size="12" class="heading-column">

    <ion-img
      src="assets/images/login-background.jpg"
      class="background-image">
    </ion-img>

    <ion-card class="background-overlay"></ion-card>

    <ion-avatar class="password-icon-circle">
      <ion-icon name="lock-closed-outline"></ion-icon>
    </ion-avatar>

    <ion-text class="page-title">
      تعيين كلمة سر جديدة
    </ion-text>

    <ion-note class="page-description">
      أدخل كلمة سر جديدة لحسابك
    </ion-note>

  </ion-col>
</ion-row>

    <!-- الجزء الأبيض -->
    <ion-row class="card-row">
      <ion-col size="12">

        <ion-card class="reset-card">

          <ion-card-header>

            <ion-card-title>
              كلمة السر الجديدة
            </ion-card-title>

            <ion-card-subtitle>
              يجب أن تتكون كلمة السر من 8 خانات على الأقل.
            </ion-card-subtitle>

          </ion-card-header>

          <ion-card-content>

            <ion-list class="reset-list" lines="none">

              <!-- كلمة السر الجديدة -->
              <ion-item class="password-input-bar" lines="none">

                <ion-input
                  type="password"
                  name="newPassword"
                  placeholder="كلمة السر الجديدة"
                  [(ngModel)]="newPassword">
                </ion-input>

                <ion-icon
                  name="lock-closed-outline"
                  slot="end"
                  class="input-icon">
                </ion-icon>

              </ion-item>

              <!-- تأكيد كلمة السر -->
              <ion-item class="password-input-bar" lines="none">

                <ion-input
                  type="password"
                  name="confirmPassword"
                  placeholder="تأكيد كلمة السر"
                  [(ngModel)]="confirmPassword">
                </ion-input>

                <ion-icon
                  name="shield-checkmark-outline"
                  slot="end"
                  class="input-icon">
                </ion-icon>

              </ion-item>

              <!-- رسالة الخطأ -->
              @if (errorMessage) {
                <ion-item class="message-item" lines="none">
                  <ion-note color="danger">
                    {{ errorMessage }}
                  </ion-note>
                </ion-item>
              }

              <!-- رسالة النجاح -->
              @if (successMessage) {
                <ion-item class="success-item" lines="none">

                  <ion-icon
                    name="checkmark-circle-outline"
                    slot="start">
                  </ion-icon>

                  <ion-label>
                    {{ successMessage }}
                  </ion-label>

                </ion-item>
              }

            </ion-list>

            <!-- زر الحفظ -->
            <ion-button
              type="button"
              expand="block"
              class="save-button"
              (click)="savePassword()">

              <ion-icon
                name="checkmark-outline"
                slot="start">
              </ion-icon>

              حفظ كلمة السر

            </ion-button>

          </ion-card-content>

        </ion-card>

      </ion-col>
    </ion-row>

  </ion-grid>

</ion-content>
