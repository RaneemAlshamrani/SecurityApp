<ion-header class="ion-no-border">

  <ion-toolbar>

    <ion-buttons slot="end">

      <ion-button
        fill="clear"
        (click)="goToPage('/home')">

        <ion-icon
          slot="icon-only"
          name="arrow-forward-outline">
        </ion-icon>

      </ion-button>

    </ion-buttons>

    <ion-title class="page-title">
      طريقة التسجيل
    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content [fullscreen]="true" class="page">

  <!-- مسح الباركود -->

  <ion-card
    class="barcode-card"
    button="true"
    (click)="scanBarcode()">

    <ion-card-content>

      <ion-icon
        name="qr-code-outline"
        class="barcode-icon">
      </ion-icon>

      <h3>مسح الباركود</h3>

      <p>اضغط لفتح الكاميرا</p>

    </ion-card-content>

  </ion-card>

  <!-- التسجيل اليدوي -->

  <ion-card
    class="manual-card"
    button="true"
    (click)="showCategories = !showCategories">

    <ion-card-content>

      <div class="manual-header">

        <div class="manual-info">

          <ion-icon
            name="create-outline"
            class="manual-icon">
          </ion-icon>

          <h3>التسجيل اليدوي</h3>

          <p>اختر فئة الدخول</p>

        </div>

        <ion-icon
          [name]="showCategories ? 'chevron-up-outline' : 'chevron-down-outline'"
          class="arrow-icon">
        </ion-icon>

      </div>

    </ion-card-content>

  </ion-card>

  @if (showCategories) {

    <div class="category-list">

      <ion-button
        fill="clear"
        expand="block"
        (click)="goToPage('/register-employee')">
        موظف
      </ion-button>

      <ion-button
        fill="clear"
        expand="block"
        (click)="goToPage('/register-trainee')">
        متدرب
      </ion-button>

      <ion-button
        fill="clear"
        expand="block"
        (click)="goToPage('/register-visitor')">
        مراجع
      </ion-button>

      <ion-button
        fill="clear"
        expand="block"
        (click)="goToPage('/register-companion')">
        مرافق
      </ion-button>

    </div>

  }

</ion-content>
