<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/home" icon="arrow-forward-outline" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>تسجيل مراجع</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding reg-page">

  <div class="title">
    <h2>أدخل بيانات المراجع</h2>
    <p>يرجى تعبئة البيانات</p>
  </div>

  <ion-card class="barcode-card" button="true" (click)="scanBarcode()">
    <ion-card-content>
      <div class="barcode-content">
        <ion-icon name="qr-code-outline" class="barcode-icon"></ion-icon>
        <span>مسح الباركود</span>
      </div>
    </ion-card-content>
  </ion-card>

  <div class="field-block">
    <label class="field-label">رقم الهوية</label>
    <ion-item>
      <ion-input placeholder="مثال: 1101234567" [(ngModel)]="visitorId"></ion-input>
    </ion-item>
  </div>

  <div class="field-block">
    <label class="field-label">اسم المراجع</label>
    <ion-item>
      <ion-input placeholder="مثال: محمد خالد" [(ngModel)]="visitorName"></ion-input>
    </ion-item>
  </div>

  <div class="field-block">
    <label class="field-label">رقم الجوال</label>
    <ion-item>
      <ion-input placeholder="0551234567" [(ngModel)]="visitorPhone"></ion-input>
    </ion-item>
  </div>

  <div class="field-block">
    <label class="field-label">البريد الإلكتروني</label>
    <ion-item>
      <ion-input type="email" placeholder="visitor@gmail.com" [(ngModel)]="visitorEmail"></ion-input>
    </ion-item>
  </div>

  <div class="field-block">
    <label class="field-label">الموظف المراد زيارته</label>
    <ion-item>
      <ion-input placeholder="صالح أحمد" [(ngModel)]="employeeName"></ion-input>
    </ion-item>
  </div>

  <div class="field-block">
    <label class="field-label">سبب الزيارة</label>
    <ion-item>
      <ion-textarea placeholder="اجتماع" [(ngModel)]="visitReason"></ion-textarea>
    </ion-item>
  </div>

  <ion-button expand="block" class="confirm-btn" (click)="saveVisitor()">تأكيد</ion-button>

</ion-content>

<ion-tab-bar slot="bottom">
  <ion-tab-button routerLink="/home">
    <ion-icon name="options-outline"></ion-icon>
    <ion-label>لوحة المراقبة</ion-label>
  </ion-tab-button>
  <ion-tab-button routerLink="/reports">
    <ion-icon name="document-text-outline"></ion-icon>
    <ion-label>التقارير</ion-label>
  </ion-tab-button>
  <ion-tab-button routerLink="/contact">
    <ion-icon name="chatbubble-outline"></ion-icon>
    <ion-label>تواصل</ion-label>
  </ion-tab-button>
</ion-tab-bar>
