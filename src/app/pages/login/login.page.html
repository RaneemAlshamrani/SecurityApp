<ion-content [fullscreen]="true" class="login-page">
  <main class="login-screen" dir="rtl">

    <ion-card class="brand-section">
      <ion-img
        src="assets/images/login-background.jpg"
        class="background-image">
      </ion-img>

      <ion-card class="background-overlay"></ion-card>

      <ion-img
        src="assets/images/amana-logo.png"
        class="amana-logo">
      </ion-img>
    </ion-card>

    <section class="login-card">
      <h1>مرحبًا بك في أمين</h1>

      <p class="welcome-text">
        يرجى تسجيل الدخول<br />
        لمتابعة استخدام النظام
      </p>

      <form class="login-form" (ngSubmit)="login($event)">

        <!-- اسم المستخدم -->
        <ion-item class="custom-input-bar" lines="none">
          <ion-input
            type="text"
            name="username"
            placeholder="اسم المستخدم"
            [(ngModel)]="username"
          ></ion-input>

          <ion-icon
            name="person-outline"
            slot="end"
            class="bar-icon">
          </ion-icon>
        </ion-item>

        <!-- كلمة المرور مع زر الإظهار والإخفاء -->
        <ion-item class="custom-input-bar" lines="none">
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="start"
            class="bar-icon toggle-icon"
            (click)="togglePasswordVisibility()"
            style="cursor: pointer;">
          </ion-icon>

          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            placeholder="••••••••"
            [(ngModel)]="password"
          ></ion-input>

          <ion-icon
            name="lock-closed-outline"
            slot="end"
            class="bar-icon">
          </ion-icon>
        </ion-item>

        @if (errorMessage) {
          <ion-text color="danger" class="error-msg">
            <p>{{ errorMessage }}</p>
          </ion-text>
        }

        <div class="login-options-row">

          <div class="remember-row">
            <ion-checkbox
              [(ngModel)]="rememberMe"
              name="rememberMe"
              justify="start"
              labelPlacement="start">
              تذكرني
            </ion-checkbox>
          </div>

          <ion-button
            type="button"
            fill="solid"
            size="small"
            class="forgot-password-button"
            routerLink="/forgot-password"
            routerDirection="forward">
            هل نسيت كلمة السر؟
          </ion-button>

        </div>

        <ion-button
          type="submit"
          expand="block"
          class="login-button">
          تسجيل دخول
        </ion-button>

      </form>
    </section>

  </main>
</ion-content>
