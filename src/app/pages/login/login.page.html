<ion-content [fullscreen]="true" class="login-page">
  <main class="login-screen" dir="rtl">

    <section class="brand-section">
      <img
        src="assets/images/amana-logo.png"
        alt="شعار أمانة جدة"
        class="amana-logo"
      />
    </section>

    <section class="login-card">
      <h1>تسجيل الدخول</h1>

      <p class="welcome-text">
        مرحبًا بك، يرجى تسجيل الدخول<br />
        لمتابعة استخدام النظام
      </p>

      <form class="login-form" (ngSubmit)="login($event)">

        <ion-item class="custom-input-bar" lines="none">
          <ion-input
            type="text"
            name="username"
            placeholder="اسم المستخدم"
            [(ngModel)]="username"
          ></ion-input>
          <ion-icon name="person-outline" slot="end" class="bar-icon"></ion-icon>
        </ion-item>

        <ion-item class="custom-input-bar" lines="none">
          <ion-input
            type="password"
            name="password"
            placeholder="••••••••"
            [(ngModel)]="password"
          ></ion-input>
          <ion-icon name="lock-closed-outline" slot="end" class="bar-icon"></ion-icon>
        </ion-item>

        <!-- validation error msg -->
        @if (errorMessage) {
          <ion-text color="danger" class="error-msg">
            <p>{{ errorMessage }}</p>
          </ion-text>
        }

        <div class="remember-row">
          <ion-checkbox 
            [(ngModel)]="rememberMe" 
            name="rememberMe" 
            justify="start" 
            labelPlacement="start">
            تذكرني
          </ion-checkbox>
        </div>

        <ion-button 
          type="submit" 
          expand="block" 
          class="login-button">
          تسجيل دخول
        </ion-button>

      </form>
    </section>

  </main>
</ion-content>
