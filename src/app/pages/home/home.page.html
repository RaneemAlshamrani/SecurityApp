<ion-content [fullscreen]="true" class="home-page">

  <!-- rectangular pure css header -->
  <div class="header-banner">

    <div class="user-info">

      <p class="welcome-label">
        أهلاً بك
      </p>

      <h1 class="user-name">
        أحمد محمد
      </h1>

      <p class="gate-info">
        بوابة رقم 3
      </p>

    </div>

  </div>


  <!-- التاريخ والوقت الحالي -->

  <div class="date-strip">

    <span>
      {{ currentDateTime }}
    </span>

  </div>


  <div class="page-container">

    <!-- زر تسجيل جديد -->

    <ion-button
      expand="block"
      class="category-btn"
      (click)="goToEntryMethod()">

      <ion-icon
        name="log-in-outline"
        slot="start">
      </ion-icon>

      <span>
        عملية تسجيل جديدة
      </span>

    </ion-button>


    <!-- آخر العمليات -->

    <section class="recent-section">

      <div class="section-header">

        <ion-icon
          name="time-outline"
          class="section-icon">
        </ion-icon>

        <h2>
          آخر العمليات
        </h2>

      </div>


      <!-- العملية الأولى -->

      <div class="activity-card">

        <div class="card-right">

          <div class="avatar-box">

            <ion-icon
              name="person-outline">
            </ion-icon>

          </div>


          <div class="details">

            <div class="type-row">

              <span class="status-dot"></span>

              <span class="role-title">
               دخول مراجع
              </span>

            </div>

            <span class="person-name">
              محمد خالد
            </span>

          </div>

        </div>


        <div class="card-left">

          <span class="timestamp">
            10:30 ص
          </span>

        </div>

      </div>


      <!-- العملية الثانية -->

      <div class="activity-card">

        <div class="card-right">

          <div class="avatar-box">

            <ion-icon
              name="briefcase-outline">
            </ion-icon>

          </div>


          <div class="details">

            <div class="type-row">

              <span class="status-dot"></span>

              <span class="role-title">
                دخول موظف
              </span>

            </div>

            <span class="person-name">
              فيصل أحمد
            </span>

          </div>

        </div>


        <div class="card-left">

          <span class="timestamp">
            10:22 ص
          </span>

        </div>

      </div>


      <!-- العملية الثالثة -->

      <div class="activity-card">

        <div class="card-right">

          <div class="avatar-box">

            <ion-icon
              name="person-outline">
            </ion-icon>

          </div>


          <div class="details">

            <div class="type-row">

              <span class="status-dot"></span>

              <span class="role-title">
                دخول متدرب
              </span>

            </div>

            <span class="person-name">
              عبدالله سالم
            </span>

          </div>

        </div>


        <div class="card-left">

          <span class="timestamp">
            10:15 ص
          </span>

        </div>

      </div>

    </section>

  </div>

</ion-content>

<ion-tab-bar slot="bottom" class="bottom-tabs">

  <ion-tab-button selected="true">
    <ion-icon name="options-outline"></ion-icon>
    <ion-label>لوحة المراقبة</ion-label>
  </ion-tab-button>

  <ion-tab-button routerLink="/reports">
    <ion-icon name="document-text-outline"></ion-icon>
    <ion-label>التقارير</ion-label>
  </ion-tab-button>

  <ion-tab-button routerLink="/contact">
    <ion-icon name="chatbubble-outline"></ion-icon>
    <ion-label>تواصل</ion-label>
  </ion-tab-button>

</ion-tab-bar>
