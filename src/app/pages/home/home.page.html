<ion-content [fullscreen]="true" class="home-page">

  <!-- rectangular pure css header -->
  <div class="header-banner">

    <div class="user-info" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

      <div>
        <p class="welcome-label">
          أهلاً بك
        </p>

        <!-- ربط اسم الموظف المجلوب من Supabase -->
        <h1 class="user-name">
          {{ staffName }}
        </h1>

        <!-- ربط رقم البوابة المجلوب من Supabase -->
        <p class="gate-info">
          بوابة رقم {{ gateNumber }}
        </p>
      </div>

      <!-- زر تسجيل الخروج -->
      <ion-button fill="clear" color="light" (click)="onLogout()">
        <ion-icon name="log-out-outline" slot="icon-only" style="font-size: 24px;"></ion-icon>
      </ion-button>

    </div>
  </div>

  <!-- التاريخ والوقت الحالي -->
  <div class="date-strip">
    <span>
      {{ currentDateTime }}
    </span>
  </div>

  <div class="page-container">

    <!-- زر تسجيل جديد -->
    <ion-button
      expand="block"
      class="category-btn"
      (click)="goToEntryMethod()">
      <ion-icon
        name="log-in-outline"
        slot="start">
      </ion-icon>
      <span>
        عملية تسجيل جديدة
      </span>
    </ion-button>

    <!-- آخر العمليات -->
    <section class="recent-section">
      <div class="section-header">
        <ion-icon
          name="time-outline"
          class="section-icon">
        </ion-icon>
        <h2>
          آخر العمليات
        </h2>
      </div>

      <!-- عرض العمليات ديناميكياً باستخدام *ngFor بدلاً من الكروت الثابتة -->
      <div class="activity-card" *ngFor="let op of latestOperations">
        <div class="card-right">
          <div class="avatar-box">
            <ion-icon
              [name]="getCategoryIcon(op.category)">
            </ion-icon>
          </div>

          <div class="details">
            <div class="type-row">
              <span class="status-dot"></span>
              <span class="role-title">
               
                {{ getCategoryTitle(op.category) }}
              </span>
            </div>
            <span class="person-name">
              {{ op.name }}
            </span>
          </div>
        </div>

        <div class="card-left">
          <span class="timestamp">
            {{ formatDate(op.created_at) }}
          </span>
        </div>
      </div>

      <!-- رسالة في حال عدم وجود عمليات -->
      <div *ngIf="latestOperations.length === 0" class="no-data-msg" style="text-align: center; color: #888; padding: 20px;">
        لا توجد عمليات تسجيل حتى الآن
      </div>

    </section>

  </div>

</ion-content>

<ion-tab-bar slot="bottom" class="bottom-tabs">
  <ion-tab-button selected="true">
    <ion-icon name="options-outline"></ion-icon>
    <ion-label>الرئيسية</ion-label>
  </ion-tab-button>

  <ion-tab-button routerLink="/reports">
    <ion-icon name="document-text-outline"></ion-icon>
    <ion-label>التقارير</ion-label>
  </ion-tab-button>

  <ion-tab-button routerLink="/contact">
    <ion-icon name="chatbubble-outline"></ion-icon>
    <ion-label>تواصل</ion-label>
  </ion-tab-button>
</ion-tab-bar>
