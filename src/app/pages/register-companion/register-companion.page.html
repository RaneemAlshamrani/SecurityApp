<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-back-button defaultHref="/home" icon="arrow-forward-outline" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>تسجيل مرافق</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding reg-page">

  <div class="title">
    <h2>أدخل بيانات المرافق</h2>
    <p>يرجى تعبئة البيانات</p>
  </div>

  <div *ngFor="let companion of companions; let i = index">

    <h3 class="companion-title">المرافق {{ i + 1 }}</h3>

    <div class="field-block">
      <label class="field-label">اسم المرافق</label>
      <ion-item>
        <ion-input placeholder="أدخل اسم المرافق" [(ngModel)]="companion.name"></ion-input>
      </ion-item>
    </div>

    <div class="field-block">
      <label class="field-label">رقم الهوية</label>
      <ion-item>
        <ion-input placeholder="أدخل رقم الهوية" [(ngModel)]="companion.nationalId"></ion-input>
      </ion-item>
    </div>

    <div class="field-block">
      <label class="field-label">اسم المراجع الأساسي</label>
      <ion-item>
        <ion-input placeholder="أدخل اسم المراجع الأساسي" [(ngModel)]="companion.visitorName"></ion-input>
      </ion-item>
    </div>

    <div class="field-block">
      <label class="field-label">رقم المراجعة</label>
      <ion-item>
        <ion-input placeholder="أدخل رقم المراجعة" [(ngModel)]="companion.visitNumber"></ion-input>
      </ion-item>
    </div>

    <div class="field-block">
      <label class="field-label">نوع المرافق</label>
      <ion-item>
        <ion-input placeholder="أدخل نوع المرافق" [(ngModel)]="companion.companionType"></ion-input>
      </ion-item>
    </div>

    <div class="field-block">
      <label class="field-label">الإدارة</label>
      <ion-item>
        <ion-input placeholder="أدخل الإدارة" [(ngModel)]="companion.department"></ion-input>
      </ion-item>
    </div>

    <div class="companion-divider"></div>

  </div>

  <ion-button expand="block" fill="outline" class="add-btn" (click)="addCompanion()">+ إضافة مرافق آخر</ion-button>

  <ion-button expand="block" class="confirm-btn" (click)="save()">تأكيد</ion-button>

</ion-content>

<ion-tab-bar slot="bottom">
  <ion-tab-button routerLink="/home">
    <ion-icon name="options-outline"></ion-icon>
    <ion-label>لوحة المراقبة</ion-label>
  </ion-tab-button>
  <ion-tab-button routerLink="/reports">
    <ion-icon name="document-text-outline"></ion-icon>
    <ion-label>التقارير</ion-label>
  </ion-tab-button>
  <ion-tab-button routerLink="/contact">
    <ion-icon name="chatbubble-outline"></ion-icon>
    <ion-label>تواصل</ion-label>
  </ion-tab-button>
</ion-tab-bar>
